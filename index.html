<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>戸田区男子部 11.18 PROJECT</title>

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 30px;
    }

    h1 {
      font-size: 42px;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #ff4b2b, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .countdown {
      font-size: 70px;
      font-weight: bold;
      margin: 20px 0;
      color: #ffcc00;
      text-shadow: 0 0 20px rgba(255,204,0,0.6);
    }

    .card-area {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 30px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      padding: 25px;
      min-width: 220px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(255,75,43,0.2);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.02);
    }

    .number {
      font-size: 40px;
      margin-top: 10px;
      font-weight: bold;
    }

    .buttons {
      margin-top: 15px;
    }

    button {
      margin: 5px;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(45deg, #ff4b2b, #ff416c);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.08);
    }

    .schedule {
      padding: 50px 20px;
      background: #111;
    }

    .section-title {
      font-size: 28px;
      margin-bottom: 20px;
    }

    @media(max-width:768px){
      h1 { font-size: 28px; }
      .countdown { font-size: 42px; }
    }
  </style>
</head>

<body>

  <section class="hero">
    <h1>戸田区男子部 11.18 PROJECT</h1>
    <p>創価学会創立記念日まで</p>
    <div class="countdown" id="countdown"></div>
  </section>

  <section class="card-area">

    <div class="card">
      <div>累計題目数</div>
      <div class="number" id="daimoku">0</div>
      <div class="buttons">
        <button onclick="addDaimoku()">🔥＋1</button>
      </div>
    </div>

    <div class="card">
      <div>累計対話数</div>
      <div class="number" id="dialogue">0</div>
      <div class="buttons">
        <button onclick="addDialogue()">⚡＋1</button>
      </div>
    </div>

    <div class="card">
      <div>活動人数</div>
      <div class="number" id="members">0</div>
      <div class="buttons">
        <button onclick="addMember()">👥＋1</button>
      </div>
    </div>

  </section>

  <section class="schedule">
    <div class="section-title">清水桜城会館 唱題会</div>
    <p>毎週 火曜・木曜 20:00〜</p>
  </section>

  <script>
    // カウントダウン
    const targetDate = new Date("2026-11-18");

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      document.getElementById("countdown").innerText = days + " 日";
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // ===== ローカル保存 =====
    let daimoku = localStorage.getItem("daimoku") ? Number(localStorage.getItem("daimoku")) : 100;
    let dialogue = localStorage.getItem("dialogue") ? Number(localStorage.getItem("dialogue")) : 10;
    let members = localStorage.getItem("members") ? Number(localStorage.getItem("members")) : 5;

    function save() {
      localStorage.setItem("daimoku", daimoku);
      localStorage.setItem("dialogue", dialogue);
      localStorage.setItem("members", members);
    }

    function render() {
      document.getElementById("daimoku").innerText = daimoku;
      document.getElementById("dialogue").innerText = dialogue;
      document.getElementById("members").innerText = members;
    }

    function addDaimoku() {
      daimoku++;
      save();
      render();
    }

    function addDialogue() {
      dialogue++;
      save();
      render();
    }

    function addMember() {
      members++;
      save();
      render();
    }

    render();
  </script>

</body>
</html>
